name: Bug report
description: Report reproducible unexpected behavior.
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, private data, provider payloads, benchmark source, or gold patches. Report vulnerabilities privately as described in SECURITY.md."
  - type: textarea
    id: context
    attributes:
      label: Context and expected outcome
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction or research protocol
      description: Include versions and verification status; omit secrets and gold answers.
    validations:
      required: true
