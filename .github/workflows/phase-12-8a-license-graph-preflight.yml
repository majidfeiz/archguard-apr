name: Phase 12.8A License and Graph Preflight

on:
  pull_request:
    paths: [".github/workflows/phase-12-8a-license-graph-preflight.yml", "research/**", "src/**", "tests/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv python install 3.12 && uv sync --frozen
      - run: uv run pytest tests/unit/test_phase128a.py --no-cov
      - run: uv run ruff format --check . && uv run ruff check . && uv run mypy src tests

  external-preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Initialize external workspace
        shell: bash
        run: |
          set -euo pipefail
          external_root="${RUNNER_TEMP}/archguard-phase-12-8a-external"
          mkdir -p "${external_root}"
          echo "EXTERNAL_ROOT=${external_root}" >> "${GITHUB_ENV}"
      - name: Validate pending external execution gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(df --output=avail -B1 "$RUNNER_TEMP" | tail -1)" -ge 4294967296
          test "$(jq -r .status research/graph-evidence/pysnooper-2.pending.json)" = EXTERNAL_EXECUTION_REQUIRED
          test "$(jq -r .status research/licenses/phase-12.8a-license-evidence.json)" = EXTERNAL_EXECUTION_REQUIRED
          test "$(jq -r .graph_evidence_validated research/readiness-facts.json)" = false
          test "$(jq -r .licenses_verified research/readiness-facts.json)" = false
          message='Immutable acquisition and source-free evidence execution remain required; no readiness gate was resolved.'
          echo "::notice title=Phase 12.8A external execution required::$message"
          {
            echo '## Phase 12.8A preflight'
            echo
            echo '- Status: `EXTERNAL_EXECUTION_REQUIRED`'
            echo '- Graph evidence validated: `false`'
            echo '- Licenses verified: `false`'
            echo "- Note: $message"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup only Phase 12.8A external data
        if: always()
        shell: bash
        run: |
          if [ -d "$EXTERNAL_ROOT" ]; then rm -rf -- "$EXTERNAL_ROOT"; fi
