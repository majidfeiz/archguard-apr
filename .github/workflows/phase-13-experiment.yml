name: Phase 13 Frozen Experiment

on:
  workflow_dispatch:
    inputs:
      confirm_phase_13:
        description: Type RUN_FROZEN_PHASE_13 to authorize the job
        required: true
        type: string
      execute_scientific_run:
        description: Execute the frozen six-run experiment after preflight
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: phase-13-frozen-experiment
  cancel-in-progress: false

jobs:
  preflight:
    if: inputs.confirm_phase_13 == 'RUN_FROZEN_PHASE_13'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PHASE13_CONFIG: configs/experiments/phase13-provider.json
      PHASE13_POPULATION: research/population/exploratory-feasibility-v1.json
      PHASE13_PROTOCOL: research/protocol/exploratory-feasibility-v2.json
      PHASE13_CHECKPOINT: research/evidence/phase-13-checkpoint-four-executions.json
      PHASE13_COST_STATE: /tmp/archguard-phase13-cost-state.json
      PHASE13_OUTPUT: /tmp/archguard-phase13-evidence
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv python install 3.12 && uv sync --frozen
      - name: Verify frozen Phase 12 state
        shell: bash
        run: |
          uv run archguard readiness gate --facts research/readiness-facts.json > "$RUNNER_TEMP/readiness.json"
          jq -e '.phase_12_complete == true and .phase_13_scientifically_ready == true
            and .phase_13_operationally_ready == true and .phase_13_ready == true
            and .blocker_codes == []' "$RUNNER_TEMP/readiness.json" >/dev/null
          jq -e '.phase_13_protocol_fingerprint == "eae1920ce71c025d2d94096798daf8b14df098249743631efe9a0aa7a541fbe8"
            and .phase_13_protocol_amendment_fingerprint == "c2e40ab75500db061269f51f781bca06125e4f2a5d80fed3a90e5300fccbab38"' research/readiness-facts.json >/dev/null
          jq -e '.population_fingerprint == "421f3129ef6bee5883c41d05f087d6faff5b2a3de3b2ea543b4d27ade1488886"
            and .protocol_fingerprint == "93494690f402d17e511d9cad1fdc92907d408ae3a923139d30537894f9ab8ce7"
            and .decision_fingerprint == "2ff4adc5be719608860845d68be15c07205bf563423099a30c617e3d29170d7d"' research/readiness-facts.json >/dev/null
          jq -e '.fingerprint == "eae1920ce71c025d2d94096798daf8b14df098249743631efe9a0aa7a541fbe8"
            and .amends_protocol_fingerprint == "93494690f402d17e511d9cad1fdc92907d408ae3a923139d30537894f9ab8ce7"
            and .primary_executions == 6 and .repetitions_per_task_condition == 1
            and .provider.maximum_calls == 12 and .provider.status == "CONFIGURED"' "$PHASE13_PROTOCOL" >/dev/null
      - name: Offline provider preflight
        run: uv run archguard experiment provider-preflight --config "$PHASE13_CONFIG" --output-directory "$PHASE13_OUTPUT" --allow-missing-secret > "$RUNNER_TEMP/provider-preflight.json"
      - name: Validate source-free continuation checkpoint
        run: |
          uv run archguard experiment validate-checkpoint --checkpoint "$PHASE13_CHECKPOINT" > "$RUNNER_TEMP/checkpoint.json"
          jq -e '.network_request == false and .completed_ordinals == [1,2,3,4]
            and .next_ordinal == 5 and .remaining_executions == 2
            and .carried_observed_usd == "0.1296325"
            and .carried_provider_calls == 4
            and .historical_stop_reason == "execution_failure"
            and .active_stop_reason == null
            and .resume_allowed == true' "$RUNNER_TEMP/checkpoint.json" >/dev/null
      - name: Enforce frozen provider ceilings
        run: |
          jq -e '.maximum_provider_calls == 12
            and .planned_primary_executions == 6
            and .available_credit_usd == "5.00"
            and .warning_cost_usd == "4.00"
            and .hard_cost_usd == "4.50"
            and .reserved_safety_margin_usd == "0.50"
            and .provider_configuration_fingerprint == "f5dc6fb5b8bf54c7cf1b58b990fa3db44073500df9903e3a7d93cbeb1ad92c2d"' "$PHASE13_CONFIG" >/dev/null
      - name: Initialize persistent source-free cost state
        run: |
          jq -n --arg fingerprint "$(jq -r .provider_configuration_fingerprint "$PHASE13_CONFIG")" '{
            schema: "archguard.phase-13-cost-state/v1",
            completed_primary_executions: 0,
            attempted_retries: 0,
            observed_provider_cost_usd: "0",
            reserved_in_flight_cost_usd: "0",
            remaining_internal_budget_usd: "4.50",
            stop_reason: "not_started",
            provider_configuration_fingerprint: $fingerprint
          }' > "$PHASE13_COST_STATE"
      - name: Execute frozen six-run experiment
        if: inputs.execute_scientific_run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          uv run archguard experiment run-frozen
          --population "$PHASE13_POPULATION"
          --protocol "$PHASE13_PROTOCOL"
          --provider-config "$PHASE13_CONFIG"
          --output "$PHASE13_OUTPUT"
          --resume-checkpoint "$PHASE13_CHECKPOINT"
          --acknowledge-provider-cost
          --acknowledge-source-processing
      - name: Report source-free cost state
        if: always()
        run: |
          if test -f "$PHASE13_OUTPUT/cost-state.json"; then
            {
              echo "## Phase 13 cost state"
              echo
              echo "- Completed primary executions: $(jq -r .completed_primary "$PHASE13_OUTPUT/cost-state.json")"
              echo "- Attempted retries: $(jq -r .attempted_retries "$PHASE13_OUTPUT/cost-state.json")"
              echo "- Observed provider cost: USD $(jq -r .observed_usd "$PHASE13_OUTPUT/cost-state.json")"
              echo "- Reserved/in-flight cost: USD $(jq -r .reserved_usd "$PHASE13_OUTPUT/cost-state.json")"
              echo "- Active stop reason: $(jq -r .stop_reason "$PHASE13_OUTPUT/cost-state.json")"
            } >> "$GITHUB_STEP_SUMMARY"
          elif test -f "$RUNNER_TEMP/checkpoint.json"; then
            {
              echo "## Phase 13 carried resume state"
              echo
              echo "- Completed ordinals: $(jq -c .completed_ordinals "$RUNNER_TEMP/checkpoint.json")"
              echo "- Next ordinal: $(jq -r .next_ordinal "$RUNNER_TEMP/checkpoint.json")"
              echo "- Carried provider calls: $(jq -r .carried_provider_calls "$RUNNER_TEMP/checkpoint.json")"
              echo "- Carried observed cost: USD $(jq -r .carried_observed_usd "$RUNNER_TEMP/checkpoint.json")"
              echo "- Historical stop reason: $(jq -r .historical_stop_reason "$RUNNER_TEMP/checkpoint.json")"
              echo "- Active stop reason: $(jq -r .active_stop_reason "$RUNNER_TEMP/checkpoint.json")"
              echo "- Resume allowed: $(jq -r .resume_allowed "$RUNNER_TEMP/checkpoint.json")"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f "$PHASE13_OUTPUT/manifest.json"; then
            {
              echo
              echo "## Phase 13 source-free aggregate"
              echo
              echo "- Completed executions: $(jq -r .completed_executions "$PHASE13_OUTPUT/manifest.json")"
              echo "- Carried executions: $(jq -r .carried_executions "$PHASE13_OUTPUT/manifest.json")"
              echo "- Newly completed executions: $(jq -r .newly_completed_executions "$PHASE13_OUTPUT/manifest.json")"
              echo "- Carried provider calls: $(jq -r .carried_provider_calls "$PHASE13_OUTPUT/manifest.json")"
              echo "- New provider calls: $(jq -r .new_provider_calls "$PHASE13_OUTPUT/manifest.json")"
              echo "- Attrition: $(jq -r .attrition "$PHASE13_OUTPUT/manifest.json")"
              echo "- Remaining budget: USD $(jq -r '.remaining_internal_budget_usd' "$PHASE13_OUTPUT/cost-state.json")"
              echo "- Total observed cost: USD $(jq -r .total_cost_usd "$PHASE13_OUTPUT/manifest.json")"
              echo "- Stop reason: $(jq -r .stop_reason "$PHASE13_OUTPUT/manifest.json")"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload source-free preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-13-provider-preflight
          path: |
            ${{ runner.temp }}/provider-preflight.json
            ${{ runner.temp }}/checkpoint.json
            /tmp/archguard-phase13-cost-state.json
            /tmp/archguard-phase13-evidence/cost-state.json
            /tmp/archguard-phase13-evidence/execution-*.json
            /tmp/archguard-phase13-evidence/manifest.json
            /tmp/archguard-phase13-evidence/pre-provider-failure.json
            /tmp/archguard-phase13-evidence/cleanup.json
          if-no-files-found: warn
          retention-days: 30
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker ps -aq --filter label=org.archguard.phase=13 | xargs --no-run-if-empty docker rm -f
          find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'archguard-phase13-*' -exec rm -rf -- {} +
