name: Phase 12.8 Readiness

on:
  pull_request:
  push:
    branches: [phase/12.8-human-review-protocol-freeze]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv lock --check
      - run: uv run ruff format --check . && uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest tests/unit/test_phase128_readiness.py tests/integration/test_phase128_cli.py --no-cov
      - run: uv run pytest
      - run: uv run archguard architecture profile compile configs/external-profiles/pysnooper-micro-pilot.yaml --output "$RUNNER_TEMP/profile-1.json"
      - run: uv run archguard architecture profile compile configs/external-profiles/pysnooper-micro-pilot.yaml --output "$RUNNER_TEMP/profile-2.json" && cmp "$RUNNER_TEMP/profile-1.json" "$RUNNER_TEMP/profile-2.json"
      - name: Validate Phase 12 closure and split readiness consistency
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r .decision research/reviews/protocol-decision.json)" = APPROVE
          test "$(jq -r .decision research/reviews/pysnooper-profile-decision.json)" = APPROVE
          test "$(jq -r .pysnooper_amended_profile_status research/readiness-facts.json)" = FROZEN
          test "$(jq -r .pysnooper_architecture_analysis_complete research/readiness-facts.json)" = true
          test "$(jq -r .pysnooper_profile_approved research/readiness-facts.json)" = true
          test "$(jq -r .pysnooper_profile_frozen research/readiness-facts.json)" = true
          test "$(jq -r .architecture_analysis_complete research/readiness-facts.json)" = true
          test "$(jq -r .profiles_frozen research/readiness-facts.json)" = true
          test "$(jq -r .protocol_frozen research/readiness-facts.json)" = true
          uv run archguard readiness gate --facts research/readiness-facts.json > "$RUNNER_TEMP/gate.json"
          test "$(jq -r .phase_13_ready "$RUNNER_TEMP/gate.json")" = true
          test "$(jq -r .phase_12_complete "$RUNNER_TEMP/gate.json")" = true
          test "$(jq -r .phase_13_scientifically_ready "$RUNNER_TEMP/gate.json")" = true
          test "$(jq -r .phase_13_operationally_ready "$RUNNER_TEMP/gate.json")" = true
          test "$(jq -r '.blocker_codes == []' "$RUNNER_TEMP/gate.json")" = true
          echo "PHASE_13_READY: scientific and provider-configuration gates passed."
      - name: Source/gold/secret policy scan
        run: |
          ! rg -n '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|sk-[A-Za-z0-9]{20,})' research docs/phase-12.8-verification.md
          test -z "$(find research -type f \( -name '*.patch' -o -name '*.diff' -o -name '*.log' -o -name '*.py' \) -print)"
