name: Phase 12.7 Linux x86 Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-12-7-linux-x86-qualification
  cancel-in-progress: false

jobs:
  qualify-pysnooper-2:
    name: PySnooper-2 qualification on Ubuntu x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      UV_FROZEN: "1"
      PYTHONUNBUFFERED: "1"
      BUGSINPY_REVISION: "11c5f1eea954a42132cfd06bf257766a7963e0fd"
      PYSNOOPER_BUGGY_REVISION: "e21a31162f4c54be693d8ca8260e42393b39abd3"
      PYSNOOPER_FIXED_REVISION: "814abc34a098c1b98cb327105ac396f985d2413e"
      PROFILE_PATH: "configs/external-profiles/pysnooper-micro-pilot.yaml"

    steps:
      - name: Checkout ArchGuard
        uses: actions/checkout@v6

      - name: Verify host and start evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase-12-7-evidence
          {
            echo "schema=archguard.phase-12.7-x86-qualification/v1"
            echo "timestamp_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "archguard_commit=${GITHUB_SHA}"
            echo "runner_os=${RUNNER_OS}"
            echo "host_architecture=$(uname -m)"
            echo "provider_calls=0"
            echo "task=PySnooper-2"
            echo "bugsinpy_revision=${BUGSINPY_REVISION}"
            echo "buggy_revision=${PYSNOOPER_BUGGY_REVISION}"
            echo "fixed_revision=${PYSNOOPER_FIXED_REVISION}"
          } | tee phase-12-7-evidence/run-metadata.txt
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          {
            uname -a
            echo
            lscpu
            echo
            free -h
            echo
            df -h
          } > phase-12-7-evidence/environment.txt

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Synchronize and verify ArchGuard
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.12
          uv lock --check
          uv sync --frozen
          uv run archguard version | tee phase-12-7-evidence/archguard-version.txt
          uv run archguard doctor > phase-12-7-evidence/archguard-doctor.txt
          uv run pytest tests/unit/test_local_micro_pilot.py tests/unit/test_external_readiness.py tests/integration/test_external_readiness_cli.py --no-cov -q 2>&1 | tee phase-12-7-evidence/readiness-tests.txt

      - name: Verify deterministic preflight and profile
        shell: bash
        run: |
          set -euo pipefail
          uv run archguard benchmark external preflight --registry configs/benchmarks.external-metadata.yaml --output "$RUNNER_TEMP/preflight-one.json"
          uv run archguard benchmark external preflight --registry configs/benchmarks.external-metadata.yaml --output "$RUNNER_TEMP/preflight-two.json"
          cmp "$RUNNER_TEMP/preflight-one.json" "$RUNNER_TEMP/preflight-two.json"
          sha256sum "$RUNNER_TEMP/preflight-one.json" | sed "s#${RUNNER_TEMP}/preflight-one.json#external-preflight.json#" > phase-12-7-evidence/external-preflight-sha256.txt

          uv run archguard architecture profile validate "${PROFILE_PATH}"
          for run in 1 2 3; do
            uv run archguard architecture profile compile "${PROFILE_PATH}" --output "$RUNNER_TEMP/profile-${run}.json"
          done
          cmp "$RUNNER_TEMP/profile-1.json" "$RUNNER_TEMP/profile-2.json"
          cmp "$RUNNER_TEMP/profile-1.json" "$RUNNER_TEMP/profile-3.json"
          sha256sum "$RUNNER_TEMP/profile-1.json" | sed "s#${RUNNER_TEMP}/profile-1.json#pysnooper-profile.json#" > phase-12-7-evidence/profile-sha256.txt
          {
            echo "profile_compilations=3"
            echo "profile_byte_identical=true"
            echo "profile_human_status=REVIEW_REQUIRED"
          } > phase-12-7-evidence/profile-status.txt

      - name: Acquire quarantined evaluator material
        shell: bash
        run: |
          set -euo pipefail
          EXTERNAL_ROOT="$RUNNER_TEMP/archguard-phase-12-7-external"
          FRAMEWORK_ROOT="${EXTERNAL_ROOT}/BugsInPy"
          SOURCE_ROOT="${EXTERNAL_ROOT}/PySnooper-source"
          EVALUATOR_ROOT="${EXTERNAL_ROOT}/evaluator-only"
          BUGGY_ROOT="${EXTERNAL_ROOT}/buggy"
          FIXED_ROOT="${EXTERNAL_ROOT}/fixed"
          mkdir -p "${EXTERNAL_ROOT}" "${EVALUATOR_ROOT}"
          chmod 700 "${EXTERNAL_ROOT}" "${EVALUATOR_ROOT}"

          git -c core.hooksPath=/dev/null clone --quiet --no-checkout --no-recurse-submodules https://github.com/soarsmu/BugsInPy.git "${FRAMEWORK_ROOT}"
          git -C "${FRAMEWORK_ROOT}" checkout --quiet --detach "${BUGSINPY_REVISION}"
          test "$(git -C "${FRAMEWORK_ROOT}" rev-parse HEAD)" = "${BUGSINPY_REVISION}"

          git -c core.hooksPath=/dev/null clone --quiet --no-checkout --no-recurse-submodules https://github.com/cool-RR/PySnooper.git "${SOURCE_ROOT}"
          git -C "${SOURCE_ROOT}" show "${PYSNOOPER_FIXED_REVISION}:tests/test_pysnooper.py" > "${EVALUATOR_ROOT}/test_pysnooper.py"
          git -C "${SOURCE_ROOT}" worktree add --quiet --detach "${BUGGY_ROOT}" "${PYSNOOPER_BUGGY_REVISION}"
          git -C "${SOURCE_ROOT}" worktree add --quiet --detach "${FIXED_ROOT}" "${PYSNOOPER_FIXED_REVISION}"
          install -m 0600 "${EVALUATOR_ROOT}/test_pysnooper.py" "${BUGGY_ROOT}/tests/test_pysnooper.py"
          test "$(git -C "${BUGGY_ROOT}" rev-parse HEAD)" = "${PYSNOOPER_BUGGY_REVISION}"
          test "$(git -C "${FIXED_ROOT}" rev-parse HEAD)" = "${PYSNOOPER_FIXED_REVISION}"

          LICENSE_SHA="$(git -C "${SOURCE_ROOT}" show "${PYSNOOPER_BUGGY_REVISION}:LICENSE" | sha256sum | cut -d' ' -f1)"
          {
            echo "framework_revision_verified=true"
            echo "buggy_revision_verified=true"
            echo "fixed_revision_verified=true"
            echo "license_file_sha256=${LICENSE_SHA}"
            echo "gold_material_location=evaluator-only-temporary"
            echo "gold_material_uploaded=false"
          } > phase-12-7-evidence/acquisition-proof.txt
          {
            echo "EXTERNAL_ROOT=${EXTERNAL_ROOT}"
            echo "BUGGY_ROOT=${BUGGY_ROOT}"
            echo "FIXED_ROOT=${FIXED_ROOT}"
          } >> "$GITHUB_ENV"

      - name: Build trusted AMD64 evaluator image
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/Dockerfile.phase12.7-evaluator" <<'DOCKERFILE'
          FROM python:3.8.1
          RUN pip install --no-cache-dir pytest==7.4.4 python_toolbox==1.3.2 six==1.15.0
          WORKDIR /task
          DOCKERFILE
          docker build --platform linux/amd64 --file "$RUNNER_TEMP/Dockerfile.phase12.7-evaluator" --tag archguard-pysnooper-evaluator:phase-12-7 "$RUNNER_TEMP"
          IMAGE_ID="$(docker image inspect archguard-pysnooper-evaluator:phase-12-7 --format '{{.Id}}')"
          IMAGE_ARCH="$(docker image inspect "${IMAGE_ID}" --format '{{.Architecture}}')"
          test "${IMAGE_ARCH}" = "amd64"
          echo "EVALUATOR_IMAGE_ID=${IMAGE_ID}" >> "$GITHUB_ENV"
          {
            echo "evaluator_image_id=${IMAGE_ID}"
            echo "evaluator_image_architecture=${IMAGE_ARCH}"
          } > phase-12-7-evidence/evaluator-image.txt

      - name: Reproduce buggy baseline three times
        shell: bash
        run: |
          set -euo pipefail
          : > phase-12-7-evidence/buggy-run-signatures.txt
          for run in 1 2 3; do
            RAW_LOG="$RUNNER_TEMP/buggy-${run}.log"
            CONTAINER_NAME="archguard-phase127-buggy-${run}"
            set +e
            docker run --name "${CONTAINER_NAME}" --label archguard.phase=12.7 --platform linux/amd64 --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=256m --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 128 --memory 512m --cpus 1 --env HOME=/tmp --env PIP_NO_CACHE_DIR=1 --volume "${BUGGY_ROOT}:/source:ro" "${EVALUATOR_IMAGE_ID}" bash -lc "cp -a /source /tmp/task && cd /tmp/task && pip install --no-deps . >/dev/null && pytest -q -s tests/test_pysnooper.py::test_custom_repr_single" > "${RAW_LOG}" 2>&1
            EXIT_CODE=$?
            set -e
            docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
            if [ "${EXIT_CODE}" -eq 0 ]; then
              echo "Buggy baseline unexpectedly passed on run ${run}" >&2
              exit 1
            fi
            FAILURE_LINE="$(grep -E 'TypeError(:.*)?$' "${RAW_LOG}" | tail -n 1 || true)"
            test -n "${FAILURE_LINE}"
            SIGNATURE="$(printf '%s' "${FAILURE_LINE}" | sha256sum | cut -d' ' -f1)"
            echo "run=${run} exit_code=${EXIT_CODE} exception=TypeError signature_sha256=${SIGNATURE}" >> phase-12-7-evidence/buggy-run-signatures.txt
            rm -f "${RAW_LOG}"
          done
          UNIQUE_SIGNATURES="$(awk -F'signature_sha256=' '{print $2}' phase-12-7-evidence/buggy-run-signatures.txt | sort -u | wc -l)"
          test "${UNIQUE_SIGNATURES}" -eq 1
          {
            echo "task=PySnooper-2"
            echo "runs=3"
            echo "expected_failure_runs=3"
            echo "stable_failure_signature=true"
            echo "classification=STABLE"
          } > phase-12-7-evidence/buggy-baseline-summary.txt

      - name: Verify trusted fixed control
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER_NAME="archguard-phase127-fixed"
          RAW_LOG="$RUNNER_TEMP/fixed.log"
          if ! docker run --name "${CONTAINER_NAME}" --label archguard.phase=12.7 --platform linux/amd64 --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=256m --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 128 --memory 512m --cpus 1 --env HOME=/tmp --env PIP_NO_CACHE_DIR=1 --volume "${FIXED_ROOT}:/source:ro" "${EVALUATOR_IMAGE_ID}" bash -lc "cp -a /source /tmp/task && cd /tmp/task && pip install --no-deps . >/dev/null && pytest -q -s tests/test_pysnooper.py::test_custom_repr_single" > "${RAW_LOG}" 2>&1; then
            docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
            echo "Trusted fixed control failed" >&2
            exit 1
          fi
          docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
          rm -f "${RAW_LOG}"
          {
            echo "task=PySnooper-2"
            echo "trusted_fixed_control=PASSED"
            echo "evaluator=QUALIFIED"
          } > phase-12-7-evidence/fixed-control-summary.txt

      - name: Verify cleanup and quarantine
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          REMAINING="$(docker ps -aq --filter label=archguard.phase=12.7)"
          if [ -n "${REMAINING}" ]; then
            docker rm -f ${REMAINING} >/dev/null
            echo "Unexpected Phase 12.7 containers required forced cleanup" >&2
            exit 1
          fi
          {
            echo "remaining_phase_12_7_containers=0"
            echo "uploaded_source_files=0"
            echo "uploaded_patch_files=0"
            echo "uploaded_raw_evaluator_logs=0"
          } > phase-12-7-evidence/cleanup-and-quarantine.txt
          if [ -n "${EXTERNAL_ROOT:-}" ] && [ -d "${EXTERNAL_ROOT}" ]; then
            rm -rf -- "${EXTERNAL_ROOT}"
          fi

      - name: Record conclusion and resources
        if: always()
        shell: bash
        run: |
          {
            echo "=== final disk ==="
            df -h
            echo
            echo "=== Docker disk usage ==="
            docker system df
          } > phase-12-7-evidence/final-resources.txt
          if [ "${JOB_STATUS}" = "success" ]; then
            {
              echo "phase=12.7"
              echo "platform_gate=PASSED"
              echo "pysnooper_2_baseline=STABLE"
              echo "pysnooper_2_evaluator=QUALIFIED"
              echo "profile_determinism=PASSED"
              echo "profile_human_review=REVIEW_REQUIRED"
              echo "phase_13_ready=false"
              echo "reason=Human profile/protocol review and representative task coverage remain required."
            } > phase-12-7-evidence/conclusion.txt
          fi
        env:
          JOB_STATUS: ${{ job.status }}

      - name: Upload source-free evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archguard-phase-12-7-x86-${{ github.run_id }}
          path: phase-12-7-evidence/
          if-no-files-found: error
          retention-days: 30
