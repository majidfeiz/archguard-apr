name: V2 Micro-Pilot Manual Gate

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type the execution authorization, or CHECK_ONLY_V2_SCIENTIFIC_RESPONSE_ACCOUNTING when execution is false
        required: true
        type: string
      execute_scientific_run:
        description: Execute after all readiness gates and Environment approval
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: v2-micro-pilot
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv python install 3.12 && uv sync --frozen
      - name: Validate canonical readiness without secrets
        run: |
          uv run pytest --no-cov tests/unit/test_v2_micro_pilot.py tests/unit/test_v2_preflight.py
          jq -e '.maximum_primary_calls == 8 and .retries == 0
            and .maximum_reserved_cost_usd == "0.9400"
            and .absolute_ceiling_usd == "1.0000"' research/v2/protocol/micro-pilot-call-plan.json
          jq -e '.V2_AMENDED_MICRO_PILOT_READY == true and .status == "READY"
            and .capability_status == "FROZEN_SUPPORTED"
            and .human_authorization_required == true
            and .provider_calls_executed == 0 and .scientific_executions == 0
            and .scientific_checkpoint_state == "EMPTY_REQUIRED"
            and .blocker_codes == []' research/v2/readiness/amended-micro-pilot-readiness.json
          uv run archguard v2-micro-pilot scientific-history-validate --root .
          jq -e '.proposal_status == "CHECK_ONLY_REQUIRES_FUTURE_HUMAN_AUTHORIZATION"
            and .execution_authorized == false
            and .decision == "ORDINAL_2_REMAINS_ATTRITION"
            and .ordinal_2_rerun_permitted == false
            and .continuation_ordinals == [3,4,5,6,7,8]
            and .maximum_total_provider_requests == 8
            and .scientific_hard_ceiling_usd == "1.0000"' research/v2/protocol/scientific-continuation-proposal-v1.json
      - name: Upload source-free preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-micro-pilot-preflight
          path: research/v2/readiness/amended-micro-pilot-readiness.json

  execute:
    needs: preflight
    # Check-only until a future protocol and explicit human authorization are approved.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: v2-micro-pilot
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv python install 3.12 && uv sync --frozen
      - name: Validate frozen protocol
        run: |
          jq -e '.V2_AMENDED_MICRO_PILOT_READY == true and .blocker_codes == []
            and .scientific_checkpoint_state == "EMPTY_REQUIRED"' research/v2/readiness/amended-micro-pilot-readiness.json
          uv run archguard v2-micro-pilot protocol-validate --root .
          test ! -e "$RUNNER_TEMP/archguard-v2-evidence"
      - name: Execute bounded micro-pilot
        run: |
          uv run archguard v2-micro-pilot execute \
            --root . \
            --output "$RUNNER_TEMP/archguard-v2-evidence" \
            --authorization "${{ inputs.confirmation }}"
      - name: Write source-free summary
        if: always()
        run: |
          CHECKPOINT="$RUNNER_TEMP/archguard-v2-evidence/checkpoint.json"
          if test -f "$CHECKPOINT"; then
            {
              echo '## ArchGuard V2.2 Micro-Pilot'
              echo
              echo "- Completed calls: $(jq -r '.completed_calls' "$CHECKPOINT") / 8"
              echo "- Provider request attempts: $(jq -r '.provider_request_attempts' "$CHECKPOINT")"
              echo "- Accepted provider calls: $(jq -r '.accepted_provider_calls' "$CHECKPOINT")"
              echo "- Infrastructure failures: $(jq -r '.infrastructure_failures' "$CHECKPOINT")"
              echo "- Remaining calls: $(jq -r '.remaining_calls' "$CHECKPOINT")"
              echo "- Observed cost (USD): $(jq -r '.ledger.observed_cost_usd' "$CHECKPOINT")"
              echo '- This amended run began from a new empty scientific checkpoint.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## ArchGuard V2.2 Micro-Pilot\n\nNo provider call was checkpointed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload controlled source-free evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-micro-pilot-source-free
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/archguard-v2-evidence/
            ${{ runner.temp }}/v2-micro-pilot-evidence.zip
      - name: Ownership-scoped cleanup
        if: always()
        run: |
          docker ps -aq --filter label=org.archguard.phase=v2-micro-pilot | xargs --no-run-if-empty docker rm -f
          find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'archguard-v2-*' -exec rm -rf -- {} +
