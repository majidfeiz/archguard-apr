name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python }}
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest -m "not docker"
      - run: uv run pytest tests/integration/test_patch_cli.py tests/integration/test_patch_worktree.py --no-cov
      - run: uv run archguard repository analyze examples/python/simple-layered-app --source-root src --output /tmp/archguard-analysis.json
      - run: uv run archguard repository inspect /tmp/archguard-analysis.json
      - run: uv run archguard graph build /tmp/archguard-analysis.json --output /tmp/archguard-graph.json
      - run: uv run archguard graph inspect /tmp/archguard-graph.json
      - run: uv run archguard graph cycles /tmp/archguard-graph.json
      - run: uv run archguard architecture profile validate examples/architecture/simple-layered.yaml
      - run: uv run archguard architecture profile compile examples/architecture/simple-layered.yaml --output /tmp/archguard-profile.json
      - run: uv run archguard architecture evaluate /tmp/archguard-graph.json --profile examples/architecture/simple-layered.yaml --output /tmp/archguard-report.json
      - run: uv run archguard architecture inspect /tmp/archguard-report.json
      - run: make architecture-self
      - run: uv run archguard context query compile --problem examples/context/problem.txt --traceback examples/context/traceback.txt --module demo.service --symbol item_names --output /tmp/context-query.json
      - run: uv run archguard context query compile --symbol item_names --module demo.service --traceback examples/context/traceback.txt --problem examples/context/problem.txt --output /tmp/context-query-two.json
      - run: cmp /tmp/context-query.json /tmp/context-query-two.json
      - run: uv run archguard context retrieve /tmp/archguard-graph.json --snapshot /tmp/archguard-analysis.json --query /tmp/context-query.json --exclude 'tests/*' --output /tmp/context-manifest-one.json
      - run: uv run archguard context retrieve /tmp/archguard-graph.json --snapshot /tmp/archguard-analysis.json --query /tmp/context-query.json --exclude 'tests/*' --output /tmp/context-manifest-two.json
      - run: cmp /tmp/context-manifest-one.json /tmp/context-manifest-two.json
      - run: uv run archguard context inspect /tmp/context-manifest-one.json
      - run: uv run archguard context explain /tmp/context-manifest-one.json file:src/demo/service.py
      - run: uv run archguard context evaluate /tmp/context-manifest-one.json --labels examples/context/relevance-labels.yaml --output /tmp/context-evaluation.json
      - run: uv run archguard context evaluation inspect /tmp/context-evaluation.json
      - run: uv run archguard context bundle repository examples/python/simple-layered-app --snapshot /tmp/archguard-analysis.json --manifest /tmp/context-manifest-one.json --output /tmp/context-bundle.json --include-source > /tmp/context-bundle-create.txt
      - run: uv run archguard context bundle repository examples/python/simple-layered-app --snapshot /tmp/archguard-analysis.json --manifest /tmp/context-manifest-one.json --output /tmp/context-bundle-two.json --include-source
      - run: cmp /tmp/context-bundle.json /tmp/context-bundle-two.json
      - run: uv run archguard context bundle inspect /tmp/context-bundle.json > /tmp/context-bundle-inspect.txt
      - run: '! grep -F "def item_names" /tmp/context-bundle-create.txt /tmp/context-bundle-inspect.txt'
      - run: make context-self
      - run: uv run pytest tests/unit/test_orchestration.py --no-cov
      - run: uv run python scripts/orchestration_demo.py --spec examples/repair/run-spec.yaml --output /tmp/orchestration-one
      - run: uv run python scripts/orchestration_demo.py --spec examples/repair/run-spec.yaml --output /tmp/orchestration-two
      - run: diff -rq /tmp/orchestration-one /tmp/orchestration-two
      - run: uv build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: docker compose config
      - run: docker build -t archguard-apr:phase-8 .
      - run: docker build -f Dockerfile.validation -t archguard-validation:phase-7 .
      - name: Docker sandbox isolation and timeout smoke
        run: |
          IMAGE_ID=$(docker image inspect archguard-validation:phase-7 --format '{{.Id}}')
          TEST_DOCKER_IMAGE="$IMAGE_ID" uv run pytest -m docker --no-cov
