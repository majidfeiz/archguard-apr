name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python }}
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest
      - run: uv run archguard repository analyze examples/python/simple-layered-app --source-root src --output /tmp/archguard-analysis.json
      - run: uv run archguard repository inspect /tmp/archguard-analysis.json
      - run: uv run archguard graph build /tmp/archguard-analysis.json --output /tmp/archguard-graph.json
      - run: uv run archguard graph inspect /tmp/archguard-graph.json
      - run: uv run archguard graph cycles /tmp/archguard-graph.json
      - run: uv build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker build -t archguard-apr:phase-3 .
