[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[project]
name = "archguard-apr"
version = "0.8.0"
description = "Agent-agnostic architecture-aware program repair research foundation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{name = "Majid Feizi"}]
dependencies = ["pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "PyYAML>=6,<7", "typer>=0.15,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
[project.urls]
Repository = "https://github.com/majidfeiz/archguard-apr"
[project.scripts]
archguard = "archguard.entrypoints.cli.app:app"
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6", "pre-commit>=4,<5"]
[tool.hatch.build.targets.wheel]
packages = ["src/archguard"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=archguard --cov-report=term-missing --cov-fail-under=90"
markers = ["unit: isolated behavior", "integration: adapter behavior", "architecture: dependency contracts", "docker: requires a trusted local Docker validation image"]
[tool.coverage.run]
branch = true
[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
